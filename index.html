<style>
:root{--bg:#9A6738;--card:#AB7543;--ink:#3A2112;--cream:#FFE2C0;--accent:#3A2112;--line:rgba(255,226,192,.45);--sheet:#FFF3E3;--sheet-ink:#3A2112;--chip:#F1DCC3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#6E4828;--sheet:#2E1A0F;--sheet-ink:#FFE2C0;--chip:#4A2D1B;--accent:#FFE2C0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#6E4828;--sheet:#2E1A0F;--sheet-ink:#FFE2C0;--chip:#4A2D1B;--accent:#FFE2C0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--cream);font-family:'Sarabun',system-ui,sans-serif;margin:0;min-height:100vh}
.serif{font-family:'Playfair Display',Georgia,serif}
.sheet{background:var(--sheet);color:var(--sheet-ink)}
.chip{background:var(--chip);border:2px solid transparent;transition:.15s}
.chip.on{border-color:#6B3A1E;background:#6B3A1E;color:#FFE2C0}
.hide{display:none!important}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35)}}
.slide-in{animation:sl .25s ease-out}
@keyframes sl{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
button:focus-visible{outline:3px solid #FFE2C0;outline-offset:2px}
</style>
</head>

function art(m){return `<img src="${IMG[m.id]}" alt="${m.en}" class="h-full w-full object-contain">`}

function card(m){
 return `<button onclick="openModal(${m.id})" class="text-left rounded-3xl p-4 transition hover:-translate-y-1" style="background:var(--card)">
  <div class="h-40 flex justify-center items-end">${art(m)}</div>
  <div class="serif text-lg leading-tight mt-3">${m.en}</div>
  <div class="text-sm opacity-90">${m.th}</div>
  <div class="mt-2 flex items-center gap-2"><span class="flex-1 border-t" style="border-color:var(--line)"></span><span class="serif text-lg">${m.price} baht</span><span class="flex-1 border-t" style="border-color:var(--line)"></span></div>
 </button>`;
}
document.getElementById("drinks").innerHTML=MENU.filter(m=>m.type==="drink").map(card).join("");
document.getElementById("cakes").innerHTML=MENU.filter(m=>m.type==="cake").map(card).join("");

function startOrder(){$("homeView").classList.add("hide");$("menuView").classList.remove("hide");$("hdr").classList.remove("hide");window.scrollTo(0,0)}
function goHome(){$("menuView").classList.add("hide");$("hdr").classList.add("hide");$("homeView").classList.remove("hide");window.scrollTo(0,0)}
let cur=null,cart=[],lastBadge=0;
const $=id=>document.getElementById(id);

function openModal(id){
 const m=MENU.find(x=>x.id===id);
 cur={m,size:0,sweet:2,tops:[],q:1};
 $("mArt").innerHTML=art(m);$("mName").textContent=m.en;$("mTh").textContent=m.th;$("mBase").textContent=m.price+" บาท";
 $("mQty").textContent=1;renderOpts();$("modal").classList.remove("hide");
}
function closeModal(){$("modal").classList.add("hide")}
function chips(list,sel,fn,multi){
 return list.map((o,i)=>{
  const label=Array.isArray(o)?o[0]+(o[1]?` +${o[1]}`:""):o;
  const on=multi?sel.includes(i):sel===i;
  return `<button onclick="${fn}(${i})" class="chip rounded-full px-3 py-2 text-sm ${on?"on":""}">${label}</button>`;
 }).join("");
}
function renderOpts(){
 const m=cur.m,drink=m.type==="drink";
 let h="";
 if(drink)h+=`<div><div class="font-semibold mb-2">ขนาดแก้ว</div><div class="flex flex-wrap gap-2">${chips(SIZES,cur.size,"setSize")}</div></div>
 <div><div class="font-semibold mb-2">ระดับความหวาน</div><div class="flex flex-wrap gap-2">${chips(SWEET,cur.sweet,"setSweet")}</div></div>`;
 h+=`<div><div class="font-semibold mb-2">${drink?"ท็อปปิ้ง":"เพิ่มเติม"} <span class="text-sm font-normal opacity-70">(เลือกได้หลายอย่าง)</span></div><div class="flex flex-wrap gap-2">${chips(drink?TOP_D:TOP_C,cur.tops,"togTop",true)}</div></div>`;
 $("mOpts").innerHTML=h;
 $("mTotal").textContent=unit()*cur.q;
}
function unit(){
 const m=cur.m,list=m.type==="drink"?TOP_D:TOP_C;
 return m.price+(m.type==="drink"?SIZES[cur.size][1]:0)+cur.tops.reduce((s,i)=>s+list[i][1],0);
}
function setSize(i){cur.size=i;renderOpts()}
function setSweet(i){cur.sweet=i;renderOpts()}
function togTop(i){const k=cur.tops.indexOf(i);k<0?cur.tops.push(i):cur.tops.splice(k,1);renderOpts()}
function qty(d){cur.q=Math.max(1,Math.min(20,cur.q+d));$("mQty").textContent=cur.q;$("mTotal").textContent=unit()*cur.q}

function addToCart(){
 const m=cur.m,drink=m.type==="drink",list=drink?TOP_D:TOP_C;
 const opts=[];
 if(drink){opts.push("ขนาด "+SIZES[cur.size][0].split(" ")[0]);opts.push("หวาน "+SWEET[cur.sweet])}
 cur.tops.slice().sort().forEach(i=>opts.push(list[i][0]));
 const key=m.id+"|"+opts.join(",");
 const ex=cart.find(c=>c.key===key);
 if(ex)ex.q+=cur.q;else cart.push({key,m,opts,unit:unit(),q:cur.q});
 closeModal();updateBadge();toast();
}
function count(){return cart.reduce((s,c)=>s+c.q,0)}
function total(){return cart.reduce((s,c)=>s+c.q*c.unit,0)}
function updateBadge(){
 const b=$("badge");b.textContent=count();
 b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");
}
function toast(){const t=$("toast");t.classList.remove("hide");clearTimeout(window._t);window._t=setTimeout(()=>t.classList.add("hide"),1500)}

function openCart(){renderCart();$("cart").classList.remove("hide")}
function closeCart(){$("cart").classList.add("hide")}
function renderCart(){
 const l=$("cartList");
 if(!cart.length){l.innerHTML='<div class="text-center opacity-70 py-16">ยังไม่มีสินค้าในตะกร้า<br>เลือกเมนูที่ชอบได้เลย</div>'}
 else l.innerHTML=cart.map((c,i)=>`<div class="rounded-2xl p-3 flex gap-3" style="background:var(--chip)">
  <div class="w-14 h-14 shrink-0 rounded-xl overflow-hidden" style="background:#AB7543">${art(c.m)}</div>
  <div class="flex-1 min-w-0">
   <div class="font-semibold leading-tight">${c.m.th}</div>
   <div class="text-xs opacity-70">${c.opts.join(" · ")||"ไม่มีตัวเลือกเพิ่ม"}</div>
   <div class="mt-2 flex items-center gap-2">
    <button onclick="chg(${i},-1)" class="chip w-8 h-8 rounded-full" aria-label="ลด">−</button>
    <span class="w-5 text-center">${c.q}</span>
    <button onclick="chg(${i},1)" class="chip w-8 h-8 rounded-full" aria-label="เพิ่ม">+</button>
    <button onclick="rm(${i})" class="ml-auto text-sm underline opacity-70">ลบ</button>
   </div>
  </div>
  <div class="font-semibold">${c.q*c.unit}</div></div>`).join("");
 $("cTotal").textContent=total();
 $("checkoutBtn").disabled=!cart.length;$("checkoutBtn").style.opacity=cart.length?1:.4;
}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);renderCart();updateBadge()}
function rm(i){cart.splice(i,1);renderCart();updateBadge()}

function checkout(){
 if(!cart.length)return;
 const no="CH-"+String(Math.floor(1000+Math.random()*9000));
 $("oNo").textContent="#"+no;
 $("oList").innerHTML=cart.map(c=>`<div class="flex justify-between gap-3"><div><div class="font-semibold">${c.q} × ${c.m.th}</div><div class="text-xs opacity-70">${c.opts.join(" · ")}</div></div><div>${c.q*c.unit}</div></div>`).join("");
 $("oTotal").textContent=total();
 closeCart();$("thanks").classList.remove("hide");window.scrollTo(0,0);
}
function newOrder(){cart=[];updateBadge();$("badge").textContent=0;$("thanks").classList.add("hide")}
</script>
</body>
</html>
